# wsquashfs-launcher en conteneur.
#
#   docker compose build
#   ./run-docker.sh /chemin/jeu.wsquashfs        (monte le dossier du jeu)
#   docker compose run --rm wsquashfs-launcher --doctor
#
# Variables (fichier .env ou environnement) :
#   WSQUASHFS_GAMES  dossier des jeux, monté sur /games (défaut : ./games)
#   WSQUASHFS_GAMES_MODE  ro (défaut) ; rw pour un jeu installé (--install),
#                    qui écrit dans son dossier — run-docker.sh les règle seul
#   UID / GID        utilisateur de l'hôte (défaut 1000) : accès à X11, au son

services:
  wsquashfs-launcher:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: wsquashfs-launcher:latest

    # FUSE (squashfuse, fuse-overlayfs) : /dev/fuse et le droit de monter.
    # privileged suffit partout ; sur un hôte qui le refuse, essayer à la
    # place cap_add SYS_ADMIN et security_opt apparmor:unconfined.
    privileged: true
    devices:
      - /dev/fuse:/dev/fuse
      - /dev/dri:/dev/dri              # GPU (Mesa : AMD, Intel) pour Vulkan/OpenGL
    # NVIDIA : NVIDIA Container Toolkit, puis décommenter :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, graphics, utility]

    environment:
      - DISPLAY=${DISPLAY:-:0}
      - PULSE_SERVER=unix:/run/user/${UID:-1000}/pulse/native

    volumes:
      - ${WSQUASHFS_GAMES:-./games}:/games:${WSQUASHFS_GAMES_MODE:-ro}
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /run/user/${UID:-1000}/pulse:/run/user/${UID:-1000}/pulse:ro
      # Sauvegardes (couches overlay, archives --backup) et cache, conservés
      # d'un lancement à l'autre
      - wsquashfs-data:/home/wineuser/.local/share/wsquashfs
      - wsquashfs-cache:/home/wineuser/.cache/wsquashfs

    network_mode: host
    ipc: host                          # mémoire partagée X11
    restart: "no"
    command: ["--help"]

volumes:
  wsquashfs-data:
  wsquashfs-cache:
